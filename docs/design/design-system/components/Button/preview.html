<!-- @dsCard group="Actions" height=140 subtitle="Primary, secondary and ghost" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  .stage { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; padding: var(--space-5); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .btn {
    appearance: none; cursor: pointer; border: 1px solid transparent; border-radius: var(--radius-md);
    padding: var(--space-3) var(--space-4); font-size: 13px; line-height: 18px; font-weight: 500;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-secondary { background: var(--surface-raised); color: var(--ink-primary); border-color: var(--border-strong); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost { background: transparent; color: var(--ink-primary); border-color: transparent; }
  .btn-ghost:hover { background: var(--surface-sunken); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
</style>
</head>
<body style="margin:0; background: var(--surface-page);">
  <div class="stage">
    <button class="btn btn-primary">Join network</button>
    <button class="btn btn-secondary">View profile</button>
    <button class="btn btn-ghost">Cancel</button>
    <button class="btn btn-primary" disabled>Disabled</button>
  </div>
</body>
</html>
