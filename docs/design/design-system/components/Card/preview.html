<!-- @dsCard group="Surfaces" height=220 subtitle="An alumni profile card" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  .stage { padding: var(--space-5); font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .card {
    max-width: 340px; background: var(--surface-raised); border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg); padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3);
  }
  .avatar { width: 44px; height: 44px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; }
  .row { display: flex; align-items: center; gap: var(--space-3); }
  .name { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--ink-primary); }
  .meta { font-size: 13px; line-height: 18px; color: var(--ink-secondary); }
  .body-text { font-size: 14px; line-height: 22px; color: var(--ink-secondary); }
  .divider { height: 1px; background: var(--border-subtle); margin: var(--space-1) 0; }
  .tag { display: inline-flex; align-items: center; border-radius: var(--radius-sm); background: var(--accent-soft);
    color: var(--accent-strong); font-size: 12px; line-height: 16px; font-weight: 500; padding: var(--space-1) var(--space-2); }
</style>
</head>
<body style="margin:0; background: var(--surface-page);">
  <div class="stage">
    <div class="card">
      <div class="row">
        <div class="avatar">AM</div>
        <div>
          <div class="name">Amira Mendes</div>
          <div class="meta">Class of 2017 · Product Design</div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="body-text">Leads design at a climate-tech startup in Lisbon. Open to mentoring recent grads.</div>
      <span class="tag">Mentor</span>
    </div>
  </div>
</body>
</html>
