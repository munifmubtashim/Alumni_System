<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Login — Desktop, Light</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet><style>
  body{margin:0}
  a{color:#ad6a4d;text-decoration:none} a:hover{color:#8f5540}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-size:12px;font-weight:600;color:#6b6560;}
  input{border:1px solid #e4dcd0;border-radius:8px;padding:11px 14px;font-family:inherit;font-size:14px;color:#2b2724;outline:none;width:100%;box-sizing:border-box;}
  input:focus{border-color:#ad6a4d;}
  .pw-wrap{position:relative;}
  .pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);appearance:none;cursor:pointer;background:transparent;border:none;color:#948c84;padding:0;display:flex;}
  .checkbox{width:16px;height:16px;border-radius:4px;border:1px solid #c7bfb2;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .checkbox.checked{background:#ad6a4d;border-color:#ad6a4d;}
  .trust{display:flex;align-items:flex-start;gap:10px;}
</style></helmet>
<div style="width:1440px;height:900px;box-sizing:border-box;background:#faf7f2;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2b2724;display:flex;">

  <div style="width:45%;background:#2b2724;color:#fdf8f3;padding:56px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box;">
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="34" height="34" viewBox="0 0 52 52">
        <rect x="0" y="0" width="52" height="52" rx="14" fill="#ad6a4d"></rect>
        <path d="M14 38 L26 14 L38 38" stroke="#2b2724" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
      </svg>
      <span style="font-size:19px;font-weight:600;">Alma</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:28px;">
      <h1 style="margin:0;font-size:34px;font-weight:600;line-height:1.3;max-width:420px;">Welcome back to your alumni network.</h1>
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="trust">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e4a07c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;flex-shrink:0;"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span style="font-size:14px;color:#d9d0c4;">50,000+ alumni across 180 universities</span>
        </div>
        <div class="trust">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e4a07c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;flex-shrink:0;"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span style="font-size:14px;color:#d9d0c4;">Find mentors in the career you're building</span>
        </div>
        <div class="trust">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e4a07c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;flex-shrink:0;"><polyline points="20 6 9 17 4 12"></polyline></svg>
          <span style="font-size:14px;color:#d9d0c4;">A private, alumni-only network</span>
        </div>
      </div>
    </div>

    <span style="font-size:12px;color:#948c84;">© 2026 Alma</span>
  </div>

  <div style="flex-grow:1;display:flex;align-items:center;justify-content:center;padding:48px;box-sizing:border-box;">
    <div style="width:100%;max-width:380px;display:flex;flex-direction:column;gap:28px;">
      <div>
        <h2 style="margin:0 0 6px;font-size:24px;font-weight:600;">Log in</h2>
        <p style="margin:0;font-size:13px;color:#6b6560;">New here? <a href="#">Create an account</a></p>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="field">
          <label>Email</label>
          <input type="text" value="sophia.martins@proton.me">
        </div>
        <div class="field">
          <label>Password</label>
          <div class="pw-wrap">
            <input type="{{pwType}}" value="HarborTrail42" style="padding-right:40px;">
            <button class="pw-toggle" onClick="{{togglePw}}" aria-label="Show password">
              <sc-if value="{{pwVisible}}" hint-placeholder-val="false">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
              </sc-if>
              <sc-if value="{{pwHidden}}" hint-placeholder-val="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </sc-if>
            </button>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;">
          <button onClick="{{toggleRemember}}" style="appearance:none;cursor:pointer;background:transparent;border:none;padding:0;display:flex;align-items:center;gap:8px;font-family:inherit;">
            <div class="{{rememberClass}}">
              <sc-if value="{{remember}}" hint-placeholder-val="true">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fdf8f3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </sc-if>
            </div>
            <span style="font-size:13px;color:#2b2724;">Remember me</span>
          </button>
          <a href="#" style="font-size:13px;font-weight:500;">Forgot password?</a>
        </div>

        <button style="appearance:none;cursor:pointer;background:#ad6a4d;border:1px solid #ad6a4d;color:#fdf8f3;border-radius:8px;padding:12px;font-size:14px;font-weight:600;font-family:inherit;margin-top:4px;">Log in</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pwVisible: false, remember: true };
  }
  togglePw() {
    this.setState({ pwVisible: !this.state.pwVisible });
  }
  toggleRemember() {
    this.setState({ remember: !this.state.remember });
  }
  renderVals() {
    return {
      pwType: this.state.pwVisible ? 'text' : 'password',
      pwVisible: this.state.pwVisible,
      pwHidden: !this.state.pwVisible,
      togglePw: () => this.togglePw(),
      toggleRemember: () => this.toggleRemember(),
      remember: this.state.remember,
      rememberClass: this.state.remember ? 'checkbox checked' : 'checkbox'
    };
  }
}
</script>
</body>
</html>
