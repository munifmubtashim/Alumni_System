<body>
<x-dc>
<helmet><style>
  body{margin:0}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-size:11px;font-weight:600;color:#6b6560;}
  input{border:1px solid #e4dcd0;border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;color:#2b2724;outline:none;background:#ffffff;width:100%;box-sizing:border-box;}
  .section-card{background:#ffffff;border:1px solid #e4dcd0;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .toggle{width:36px;height:20px;border-radius:999px;background:#ad6a4d;position:relative;flex-shrink:0;}
  .toggle-knob{width:14px;height:14px;border-radius:999px;background:#fdf8f3;position:absolute;top:3px;right:3px;}
</style></helmet>
<div style="width:100%;min-height:1700px;background:#faf7f2;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2b2724;box-sizing:border-box;">

  <div style="display:flex;align-items:center;gap:10px;padding:14px 16px;background:#ffffff;border-bottom:1px solid #e4dcd0;">
    <a href="S1-Phone-Light.dc.html" style="display:flex;color:#2b2724;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <span style="font-size:14px;font-weight:600;">My Profile</span>
  </div>

  <div style="padding:16px 16px 90px;display:flex;flex-direction:column;gap:16px;">
    <div class="section-card">
      <h2 style="margin:0;font-size:14px;font-weight:600;">Personal</h2>
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:48px;height:48px;border-radius:999px;background:#f3e4d9;color:#8f5540;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;">SM</div>
        <button style="appearance:none;cursor:pointer;background:#ffffff;border:1px solid #e4dcd0;border-radius:8px;padding:7px 12px;font-size:12px;font-weight:500;font-family:inherit;color:#2b2724;">Change photo</button>
      </div>
      <div class="field"><label>Full name</label><input type="text" value="Sophia Martins"></div>
      <div class="field"><label>Headline</label><input type="text" value="Senior Product Manager at Meridian Health"></div>
      <div class="field"><label>Location</label><input type="text" value="Toronto, Canada"></div>
    </div>

    <div class="section-card">
      <h2 style="margin:0;font-size:14px;font-weight:600;">Education</h2>
      <div class="field"><label>University</label><input type="text" value="University of Toronto"></div>
      <div class="field"><label>Degree</label><input type="text" value="B.A. Economics"></div>
      <div class="field"><label>Graduation year</label><input type="text" value="2016"></div>
    </div>

    <div class="section-card">
      <h2 style="margin:0;font-size:14px;font-weight:600;">Career</h2>
      <div class="field"><label>Current role</label><input type="text" value="Senior Product Manager"></div>
      <div class="field"><label>Company</label><input type="text" value="Meridian Health"></div>
    </div>

    <div class="section-card">
      <h2 style="margin:0;font-size:14px;font-weight:600;">Mentorship</h2>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:13px;font-weight:500;">Available for mentorship</div>
        <div class="toggle"><div class="toggle-knob"></div></div>
      </div>
    </div>

    <div class="section-card">
      <h2 style="margin:0;font-size:14px;font-weight:600;">Password</h2>
      <div class="field"><label>Current password</label><input type="password" value="••••••••••"></div>
      <div class="field"><label>New password</label><input type="password" placeholder="Leave blank to keep current"></div>
    </div>
  </div>

  <div style="position:fixed;bottom:0;left:0;right:0;background:#ffffff;border-top:1px solid #e4dcd0;padding:12px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -4px 16px rgba(43,39,36,0.06);">
    <span style="font-size:12px;font-weight:500;color:#8f5540;display:flex;align-items:center;gap:6px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      You have unsaved changes
    </span>
    <div style="display:flex;gap:8px;">
      <button style="flex:1;appearance:none;cursor:pointer;background:#ffffff;border:1px solid #e4dcd0;border-radius:8px;padding:10px;font-size:13px;font-weight:500;font-family:inherit;color:#2b2724;">Discard</button>
      <button style="flex:1;appearance:none;cursor:pointer;background:#ad6a4d;border:1px solid #ad6a4d;color:#fdf8f3;border-radius:8px;padding:10px;font-size:13px;font-weight:600;font-family:inherit;">Save changes</button>
    </div>
  </div>
</div>
