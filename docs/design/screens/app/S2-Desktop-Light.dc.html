<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Directory — Desktop, Light</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet><style>
  body{margin:0}
  a{color:#ad6a4d;text-decoration:none} a:hover{color:#8f5540}
  .nav-link{font-size:14px;font-weight:500;color:#6b6560;padding:22px 0}
  .nav-link.active{color:#2b2724;border-bottom:2px solid #ad6a4d}
</style></helmet>
<div style="width:100%;min-height:1000px;background:#faf7f2;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2b2724;">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 32px;height:64px;background:#ffffff;border-bottom:1px solid #e4dcd0;">
    <div style="display:flex;align-items:center;gap:32px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:28px;height:28px;border-radius:7px;background:#ad6a4d;color:#fdf8f3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;">A</div>
        <span style="font-size:15px;font-weight:600;">Alumni Network</span>
      </div>
      <nav style="display:flex;gap:24px;">
        <a href="S2-Desktop-Light.dc.html" class="nav-link active">Directory</a>
        <a href="S4-Desktop-Light.dc.html" class="nav-link">Feed</a>
        <a href="S5-Desktop-Light.dc.html" class="nav-link">My Profile</a>
        <a href="S6-Desktop-Light.dc.html" class="nav-link">Admin</a>
      </nav>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="display:inline-flex;background:#f0ebe3;border:1px solid #e4dcd0;border-radius:999px;padding:2px;gap:2px;">
        <button style="appearance:none;border:1px solid #e4dcd0;cursor:pointer;background:#ffffff;color:#2b2724;font-size:11px;font-weight:500;border-radius:999px;padding:5px 9px;font-family:inherit;">Light</button>
        <button style="appearance:none;border:none;cursor:pointer;background:transparent;color:#6b6560;font-size:11px;font-weight:500;border-radius:999px;padding:5px 9px;font-family:inherit;">Dark</button>
        <button style="appearance:none;border:none;cursor:pointer;background:transparent;color:#6b6560;font-size:11px;font-weight:500;border-radius:999px;padding:5px 9px;font-family:inherit;">Sys</button>
      </div>
      <div style="width:32px;height:32px;border-radius:999px;background:#f3e4d9;color:#8f5540;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;">SM</div>
    </div>
  </header>

  <div style="padding:32px;display:flex;flex-direction:column;gap:20px;">
    <div style="display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <h1 style="margin:0;font-size:22px;font-weight:600;">Alumni Directory</h1>
      <span style="font-size:13px;color:#6b6560;">Showing 1–6 of 142 alumni</span>
    </div>

    <div style="max-width:480px;">
      <div style="display:flex;align-items:center;gap:10px;background:#f0ebe3;border:1px solid #e4dcd0;border-radius:8px;padding:11px 14px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#948c84" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" placeholder="Search by name, company or role" style="flex-grow:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:15px;color:#2b2724;">
      </div>
    </div>

    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
      <span style="display:inline-flex;align-items:center;gap:6px;background:#f3e4d9;color:#8f5540;border-radius:999px;padding:7px 10px 7px 14px;font-size:13px;font-weight:500;">
        Department: Computer Science
        <button style="appearance:none;border:none;background:transparent;cursor:pointer;color:#8f5540;display:flex;padding:2px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </span>
      <span style="display:inline-flex;align-items:center;gap:6px;background:#f3e4d9;color:#8f5540;border-radius:999px;padding:7px 10px 7px 14px;font-size:13px;font-weight:500;">
        Grad. year: 2015–2020
        <button style="appearance:none;border:none;background:transparent;cursor:pointer;color:#8f5540;display:flex;padding:2px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
      </span>
      <button style="appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:#ffffff;border:1px solid #e4dcd0;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:500;color:#2b2724;font-family:inherit;">University<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b6560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      <button style="appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:#ffffff;border:1px solid #e4dcd0;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:500;color:#2b2724;font-family:inherit;">Field<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6b6560" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
      <a href="#" style="font-size:13px;font-weight:500;margin-left:4px;">Clear all</a>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;">
      <sc-for list="{{alumni}}" as="p" hint-placeholder-count="6">
        <a href="S3-Desktop-Light.dc.html" style="background:#ffffff;border:1px solid #e4dcd0;border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;color:#2b2724;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:44px;height:44px;border-radius:999px;background:#f3e4d9;color:#8f5540;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex-shrink:0;">{{p.initials}}</div>
            <div style="min-width:0;">
              <div style="font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{p.name}}</div>
              <div style="font-size:13px;color:#6b6560;">Class of {{p.year}}</div>
            </div>
          </div>
          <div style="height:1px;background:#e4dcd0;"></div>
          <div style="font-size:13px;color:#6b6560;">{{p.department}}</div>
          <div style="font-size:14px;">{{p.job}}</div>
          <sc-if value="{{p.tag}}" hint-placeholder-val="{{true}}">
            <span style="align-self:flex-start;display:inline-flex;border-radius:4px;background:#f3e4d9;color:#8f5540;font-size:12px;font-weight:500;padding:4px 8px;">{{p.tag}}</span>
          </sc-if>
        </a>
      </sc-for>
    </div>

    <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;">
      <button disabled style="appearance:none;cursor:not-allowed;background:#ffffff;border:1px solid #e4dcd0;border-radius:8px;padding:8px 14px;font-size:13px;color:#948c84;font-family:inherit;">Prev</button>
      <button style="appearance:none;cursor:pointer;background:#ad6a4d;border:1px solid #ad6a4d;color:#fdf8f3;border-radius:8px;padding:8px 13px;font-size:13px;font-family:inherit;">1</button>
      <button style="appearance:none;cursor:pointer;background:#ffffff;border:1px solid #e4dcd0;border-radius:8px;padding:8px 13px;font-size:13px;color:#2b2724;font-family:inherit;">2</button>
      <button style="appearance:none;cursor:pointer;background:#ffffff;border:1px solid #e4dcd0;border-radius:8px;padding:8px 13px;font-size:13px;color:#2b2724;font-family:inherit;">3</button>
      <span style="font-size:13px;color:#948c84;padding:0 4px;">…</span>
      <button style="appearance:none;cursor:pointer;background:#ffffff;border:1px solid #e4dcd0;border-radius:8px;padding:8px 13px;font-size:13px;color:#2b2724;font-family:inherit;">24</button>
      <button style="appearance:none;cursor:pointer;background:#ffffff;border:1px solid #e4dcd0;border-radius:8px;padding:8px 14px;font-size:13px;color:#2b2724;font-family:inherit;">Next</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      alumni: [
        { initials: 'AM', name: 'Amira Mendes', year: '2017', department: 'Product Design', job: 'Design Lead, Terra Climate', tag: 'Mentor' },
        { initials: 'JK', name: 'Jonas Kessler', year: '2015', department: 'Computer Science', job: 'Staff Engineer, Nimbus Cloud', tag: null },
        { initials: 'RS', name: 'Priya Rao Shah', year: '2020', department: 'Economics', job: 'Associate, Harrow Capital', tag: null },
        { initials: 'TO', name: 'Tomás Oliveira', year: '2012', department: 'Mechanical Engineering', job: 'Founder, Oliveira Works', tag: 'Mentor' },
        { initials: 'LN', name: 'Lena Novak', year: '2019', department: 'Public Health', job: 'Program Manager, City Health Dept.', tag: null },
        { initials: 'DW', name: 'Darius Whitfield', year: '2016', department: 'Business Administration', job: 'Marketing Director, Fenwick & Co.', tag: 'Available' }
      ]
    };
  }
}
</script>
</body>
</html>
