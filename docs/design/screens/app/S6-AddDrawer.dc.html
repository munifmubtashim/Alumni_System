<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin — Add alumni drawer</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
</head>
<body>
<x-dc>
<helmet><style>
  body{margin:0}
  a{color:#ad6a4d;text-decoration:none}
  .nav-link{font-size:14px;font-weight:500;color:#6b6560;padding:22px 0}
  .nav-link.active{color:#2b2724;border-bottom:2px solid #ad6a4d}
  .field{display:flex;flex-direction:column;gap:6px;}
  label{font-size:12px;font-weight:600;color:#6b6560;}
  input,select{border:1px solid #e4dcd0;border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;color:#2b2724;outline:none;background:#ffffff;width:100%;box-sizing:border-box;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @keyframes slideIn{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .drawer{animation:slideIn 0.25s ease-out;}
</style></helmet>
<div style="width:100%;min-height:1000px;background:#faf7f2;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#2b2724;position:relative;overflow:hidden;">

  <header style="display:flex;align-items:center;justify-content:space-between;gap:24px;padding:0 32px;height:64px;background:#ffffff;border-bottom:1px solid #e4dcd0;">
    <div style="display:flex;align-items:center;gap:32px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:28px;height:28px;border-radius:7px;background:#ad6a4d;color:#fdf8f3;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;">A</div>
        <span style="font-size:15px;font-weight:600;">Alumni Network</span>
      </div>
      <nav style="display:flex;gap:24px;">
        <a href="S2-Desktop-Light.dc.html" class="nav-link">Directory</a>
        <a href="S4-Desktop-Light.dc.html" class="nav-link">Feed</a>
        <a href="S5-Desktop-Light.dc.html" class="nav-link">My Profile</a>
        <a href="S6-Desktop-Light.dc.html" class="nav-link active">Admin</a>
      </nav>
    </div>
    <div style="width:32px;height:32px;border-radius:999px;background:#f3e4d9;color:#8f5540;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;">SM</div>
  </header>

  <div style="position:absolute;inset:64px 0 0 0;background:rgba(43,39,36,0.35);">
    <div class="drawer" style="position:absolute;top:0;right:0;bottom:0;width:420px;background:#ffffff;border-left:1px solid #e4dcd0;box-shadow:-12px 0 32px rgba(43,39,36,0.1);display:flex;flex-direction:column;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #e4dcd0;">
        <h2 style="margin:0;font-size:16px;font-weight:600;">Add alumni</h2>
        <a href="S6-Desktop-Light.dc.html" style="color:#6b6560;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>
      </div>
      <div style="flex-grow:1;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px;">
        <div class="field"><label>Full name</label><input type="text" placeholder="e.g. Hana Kobayashi"></div>
        <div class="field"><label>Email</label><input type="text" placeholder="name@example.com"></div>
        <div class="row2">
          <div class="field"><label>University</label><input type="text" placeholder="e.g. Keio University"></div>
          <div class="field"><label>Graduation year</label><input type="text" placeholder="e.g. 2021"></div>
        </div>
        <div class="field"><label>Department</label><input type="text" placeholder="e.g. International Business"></div>
        <div class="field"><label>Current role &amp; company</label><input type="text" placeholder="e.g. Analyst, Keio Capital"></div>
        <div class="field">
          <label>Role</label>
          <select><option>Alumni</option><option>Student</option><option>Admin</option></select>
        </div>
      </div>
      <div style="padding:16px 24px;border-top:1px solid #e4dcd0;display:flex;justify-content:flex-end;gap:10px;">
        <a href="S6-Desktop-Light.dc.html" style="appearance:none;cursor:pointer;background:#ffffff;border:1px solid #e4dcd0;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:500;color:#2b2724;">Cancel</a>
        <button style="appearance:none;cursor:pointer;background:#ad6a4d;border:1px solid #ad6a4d;color:#fdf8f3;border-radius:8px;padding:10px 20px;font-size:13px;font-weight:600;font-family:inherit;">Add alumni</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic { renderVals() { return {}; } }
</script>
</body>
</html>
