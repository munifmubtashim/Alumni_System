<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alma</title>
    <script>
      // Applies the saved theme before first paint so a Dark choice never flashes light.
      // The key must match THEME_STORAGE_KEY in src/store/themeAtom.ts (a test checks it).
      // React takes over via useApplyTheme once the app mounts.
      try {
        var p = JSON.parse(localStorage.getItem('alumni.theme'));
        var d =
          p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
